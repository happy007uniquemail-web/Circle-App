[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — React Router serves every route client-side,
# so deep links like /home, /cabins or /u/maya must load index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# SEC-04: security headers for every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # frame-ancestors 'none' duplicates X-Frame-Options for modern agents.
    # Images/media allow data: (client-compressed uploads), blob: (demo-mode
    # IndexedDB video) and Supabase Storage; connect covers PostgREST + Realtime.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' blob: https://*.supabase.co; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
